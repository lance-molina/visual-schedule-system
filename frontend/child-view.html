<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child View | Visual Schedule System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md bg-white border-bottom px-3 py-2">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="dashboard.html">
            <i class="fa-solid fa-calendar-check"></i> Visual Schedule
        </a>
        <div class="d-flex align-items-center gap-2">
            <a href="dashboard.html" class="btn btn-outline-primary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Caregiver Mode
            </a>
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 860px;">
    <!-- Child Selector & Reward Banner -->
    <div class="card border-0 shadow-sm p-4 mb-4" style="background: linear-gradient(135deg, #4A90D9, #357ABD); color: #fff;">
        <div class="row align-items-center g-3">
            <div class="col-md-7 d-flex align-items-center gap-3">
                <img id="childAvatar" src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
                     alt="Child Avatar" class="rounded-circle border border-3 border-white"
                     style="width: 80px; height: 80px; object-fit: cover; background: #fff;">
                <div>
                    <h2 id="childGreeting" class="fw-bold mb-1">Hello!</h2>
                    <p class="mb-0 opacity-75">Tap each activity card when you finish!</p>
                </div>
            </div>
            <div class="col-md-5 text-md-end">
                <select id="childSelector" class="form-select mb-2 text-dark fw-bold"></select>
                <div class="d-inline-flex align-items-center gap-2 bg-white text-dark px-3 py-2 rounded-pill fw-bold shadow-sm">
                    <i class="fa-solid fa-star text-warning fa-lg"></i>
                    <span id="starCounter">0 / 0 Stars Earned!</span>
                </div>
            </div>
        </div>

        <!-- Big Visual Progress Bar -->
        <div class="mt-4">
            <div class="progress" style="height: 24px; border-radius: 12px; background: rgba(255,255,255,0.3);">
                <div id="childProgressBar" class="progress-bar bg-success fw-bold" role="progressbar" style="width: 0%;">0%</div>
            </div>
        </div>
    </div>

    <!-- Celebration Banner (Hidden until 100% complete) -->
    <div id="celebrationBanner" class="alert alert-success text-center p-4 mb-4 d-none shadow-sm">
        <i class="fa-solid fa-trophy fa-3x text-warning mb-2"></i>
        <h3 class="fw-bold mb-1">Amazing Job! All Routines Finished!</h3>
        <p class="mb-0">You earned all your stars for today!</p>
    </div>

    <!-- Child Tasks List -->
    <div id="childTasksContainer" class="d-flex flex-column gap-3"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
    api.requireAuth();
    applyAccessibilitySettings();

    let childrenData = [];
    let currentScheduleId = null;
    let currentTasks = [];

    async function initChildView() {
        childrenData = await api.get('/children');
        const selector = document.getElementById('childSelector');
        selector.innerHTML = childrenData.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        const urlParams = new URLSearchParams(window.location.search);
        const paramChild = urlParams.get('child_id');
        if (paramChild && childrenData.some(c => c.id == paramChild)) {
            selector.value = paramChild;
        }

        selector.addEventListener('change', () => loadChildRoutine(selector.value));
        if (childrenData.length > 0) {
            loadChildRoutine(selector.value);
        }
    }

    async function loadChildRoutine(childId) {
        const child = childrenData.find(c => c.id == childId);
        if (child) {
            document.getElementById('childGreeting').textContent = `Hi, ${child.name}!`;
            document.getElementById('childAvatar').src = getChildAvatar(child);
        }

        const schedules = await api.get(`/schedules/${childId}`);
        currentScheduleId = schedules[0].id;
        currentTasks = await api.get(`/tasks/${currentScheduleId}`);
        renderChildTasks();
    }

    function renderChildTasks() {
        const container = document.getElementById('childTasksContainer');
        const total = currentTasks.length;
        const completed = currentTasks.filter(t => t.status === 'completed').length;
        const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

        document.getElementById('starCounter').textContent = `${completed} / ${total} Stars Earned!`;
        const bar = document.getElementById('childProgressBar');
        bar.style.width = `${pct}%`;
        bar.textContent = `${pct}%`;

        document.getElementById('celebrationBanner').classList.toggle('d-none', !(total > 0 && completed === total));

        if (!total) {
            container.innerHTML = `
                <div class="card p-5 text-center border-0 shadow-sm">
                    <i class="fa-solid fa-face-smile fa-3x text-primary mb-3"></i>
                    <h4>No tasks scheduled yet!</h4>
                    <p class="text-muted">Ask a caregiver to add activities in the Schedule Creator.</p>
                </div>`;
            return;
        }

        container.innerHTML = currentTasks.map(t => {
            const isDone = t.status === 'completed';
            return `
            <div class="card p-4 shadow-sm child-task-card cat-${t.category} ${isDone ? 'completed' : ''}"
                 onclick="toggleTask(${t.id})">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <div class="d-flex align-items-center gap-4">
                        <div class="rounded-circle d-flex align-items-center justify-content-center shadow-sm"
                             style="width: 72px; height: 72px; background: #fff; color: #4A90D9;">
                            <i class="fa-solid ${t.icon} fa-2x"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-1 ${isDone ? 'text-decoration-line-through text-muted' : ''}">${t.name}</h3>
                            <div class="fs-5 text-muted">
                                <i class="fa-regular fa-clock me-1"></i> ${formatTime12Hr(t.task_time)} &bull; ${t.duration} mins
                            </div>
                        </div>
                    </div>
                    <div>
                        <button class="btn ${isDone ? 'btn-success' : 'btn-primary'} btn-lg px-4 py-3 fs-5">
                            <i class="fa-solid ${isDone ? 'fa-circle-check' : 'fa-hand-pointer'} me-2"></i>
                            ${isDone ? 'Done! ⭐' : 'Tap When Done'}
                        </button>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    async function toggleTask(taskId) {
        const res = await api.patch(`/tasks/${taskId}/complete`);
        if (res.status === 'completed') {
            playSuccessSound();
        }
        currentTasks = await api.get(`/tasks/${currentScheduleId}`);
        renderChildTasks();
    }

    initChildView();
</script>
</body>
</html>
