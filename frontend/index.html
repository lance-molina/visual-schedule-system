<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Visual Schedule System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card shadow-sm border-0 p-4" style="max-width: 460px; width: 100%;">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
             style="width: 72px; height: 72px; background-color: #EBF4FC; color: #4A90D9;">
            <i class="fa-solid fa-calendar-check fa-2x"></i>
        </div>
        <h2 class="fw-bold mb-1">Visual Schedule</h2>
        <p class="text-muted mb-0">Routine & Task Support for Children</p>
    </div>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <!-- Login Form -->
    <form id="loginForm">
        <div id="nameGroup" class="mb-3 d-none">
            <label class="form-label fw-semibold">Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="nameInput" class="form-control" placeholder="Maria Santos">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" id="emailInput" class="form-control" value="caregiver@demo.com" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="passwordInput" class="form-control" value="password123" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <select id="roleInput" class="form-select" required>
                <option value="Caregiver">Caregiver</option>
                <option value="Occupational Therapist">Occupational Therapist</option>
                <option value="SPED Teacher">SPED Teacher</option>
            </select>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <button type="button" id="toggleModeBtn" class="btn btn-link p-0 text-decoration-none">
                Create account
            </button>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fs-5">
            <i class="fa-solid fa-right-to-bracket me-2"></i><span id="submitBtnText">Login</span>
        </button>
    </form>

    <div class="mt-3 text-center">
        <small class="text-muted">Demo Account: <strong>caregiver@demo.com</strong> / <strong>password123</strong></small>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
    let isRegisterMode = false;
    const loginForm = document.getElementById('loginForm');
    const nameGroup = document.getElementById('nameGroup');
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const alertBox = document.getElementById('alertBox');

    function showAlert(msg, type = 'danger') {
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = msg;
        alertBox.classList.remove('d-none');
    }

    toggleModeBtn.addEventListener('click', () => {
        isRegisterMode = !isRegisterMode;
        nameGroup.classList.toggle('d-none', !isRegisterMode);
        submitBtnText.textContent = isRegisterMode ? 'Register' : 'Login';
        toggleModeBtn.textContent = isRegisterMode ? 'Back to Login' : 'Create account';
        alertBox.classList.add('d-none');
    });

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');

        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        const role = document.getElementById('roleInput').value;
        const name = document.getElementById('nameInput').value.trim();

        try {
            if (isRegisterMode) {
                await api.post('/auth/register', { name, email, password, role });
                showAlert('Registration successful! Logging you in...', 'success');
            }
            const res = await api.post('/auth/login', { email, password });
            api.setSession(res.token, res.user);
            window.location.href = 'dashboard.html';
        } catch (err) {
            showAlert(err.message);
        }
    });
</script>
</body>
</html>
