<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Visual Schedule System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- Responsive Top Navbar -->
<nav class="navbar navbar-expand-md bg-white border-bottom px-3 py-2">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="dashboard.html">
            <i class="fa-solid fa-calendar-check"></i> Visual Schedule
        </a>
        <button class="navbar-toggler touch-target" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="d-none d-md-flex align-items-center gap-3">
            <div class="text-end">
                <div id="navUserName" class="fw-bold">Maria Santos</div>
                <small id="navUserRole" class="text-muted">Caregiver</small>
            </div>
            <button onclick="api.logout()" class="btn btn-outline-danger btn-sm">
                <i class="fa-solid fa-right-from-bracket me-1"></i> <span data-i18n="logout">Logout</span>
            </button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3 col-lg-2 sidebar collapse d-md-block p-3" id="sidebarMenu">
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house"></i> <span data-i18n="dashboard">Dashboard</span></a>
                <a class="nav-link" href="schedule-creator.html"><i class="fa-solid fa-calendar-plus"></i> <span data-i18n="schedules">Schedule Creator</span></a>
                <a class="nav-link" href="child-view.html"><i class="fa-solid fa-child-reaching"></i> <span data-i18n="childView">Child View</span></a>
                <a class="nav-link" href="progress.html"><i class="fa-solid fa-chart-column"></i> <span data-i18n="progress">Progress</span></a>
                <a class="nav-link" href="settings.html"><i class="fa-solid fa-gear"></i> <span data-i18n="settings">Settings</span></a>
                <button onclick="api.logout()" class="btn btn-outline-danger d-md-none mt-3 w-100">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                </button>
            </nav>
        </div>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                <div>
                    <h2 class="fw-bold mb-0">Caregiver Dashboard</h2>
                    <p class="text-muted mb-0">Manage child profiles and monitor daily task progress</p>
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#childModal" onclick="openAddModal()">
                    <i class="fa-solid fa-plus me-2"></i> Add New Child
                </button>
            </div>

            <!-- Quick Stats Cards -->
            <div class="row g-3 mb-4">
                <div class="col-sm-4">
                    <div class="card border-0 shadow-sm p-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <div class="text-muted">Total Children</div>
                                <h2 id="statChildren" class="fw-bold mb-0">0</h2>
                            </div>
                            <div class="rounded-circle p-3" style="background:#EBF4FC; color:#4A90D9;">
                                <i class="fa-solid fa-children fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="card border-0 shadow-sm p-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <div class="text-muted">Tasks Completed Today</div>
                                <h2 id="statCompleted" class="fw-bold mb-0">0</h2>
                            </div>
                            <div class="rounded-circle p-3" style="background:#F2FAE9; color:#7ED321;">
                                <i class="fa-solid fa-circle-check fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="card border-0 shadow-sm p-3">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <div class="text-muted">Upcoming Routines</div>
                                <h2 id="statUpcoming" class="fw-bold mb-0">0</h2>
                            </div>
                            <div class="rounded-circle p-3" style="background:#FEF6E7; color:#F5A623;">
                                <i class="fa-solid fa-clock fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Child Profiles Grid -->
            <h4 class="fw-bold mb-3">Child Profiles</h4>
            <div id="childrenGrid" class="row g-4"></div>
        </main>
    </div>
</div>

<!-- Add / Edit Child Modal -->
<div class="modal fade" id="childModal" tabindex="-1">
    <div class="modal-dialog">
        <form id="childForm" class="modal-content">
            <div class="modal-header">
                <h5 id="modalTitle" class="modal-title fw-bold">Add New Child</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="childId">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Child Name</label>
                    <input type="text" id="childName" class="form-control" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">Age (Years)</label>
                        <input type="number" id="childAge" class="form-control" min="1" max="18" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Gender</label>
                        <select id="childGender" class="form-select" required>
                            <option value="Male">Male (Boy)</option>
                            <option value="Female">Female (Girl)</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Developmental Delay Domain</label>
                    <select id="childDomain" class="form-select" required>
                        <option value="Autism Spectrum Disorder (ASD)">Autism Spectrum Disorder (ASD)</option>
                        <option value="Speech & Language Delay">Speech & Language Delay</option>
                        <option value="Fine Motor Delay">Fine Motor Delay</option>
                        <option value="Cognitive / Global Delay">Cognitive / Global Delay</option>
                        <option value="ADHD / Sensory Processing">ADHD / Sensory Processing</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Avatar / Photo URL (Optional)</label>
                    <input type="url" id="childPhoto" class="form-control" placeholder="Leave blank for default child avatar">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Caregiver / OT Notes</label>
                    <textarea id="childNotes" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Child Profile</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
    api.requireAuth();
    renderNavbarAndSidebar('dashboard.html');

    let childrenList = [];
    const childModal = new bootstrap.Modal(document.getElementById('childModal'));

    async function loadDashboard() {
        try {
            const [stats, children] = await Promise.all([
                api.get('/stats'),
                api.get('/children')
            ]);

            document.getElementById('statChildren').textContent = stats.total_children;
            document.getElementById('statCompleted').textContent = stats.completed_today;
            document.getElementById('statUpcoming').textContent = stats.upcoming_routines;

            childrenList = children;
            const grid = document.getElementById('childrenGrid');
            if (!children.length) {
                grid.innerHTML = `<div class="col-12"><div class="alert alert-info">No child profiles yet. Click "Add New Child" to begin.</div></div>`;
                return;
            }

            grid.innerHTML = children.map(c => {
                const total = c.total_tasks || 0;
                const done = c.completed_tasks || 0;
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;

                return `
                <div class="col-md-6 col-xl-4">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <img src="${getChildAvatar(c)}" alt="${c.name}" class="rounded-circle border" style="width:68px; height:68px; object-fit:cover;">
                            <div>
                                <h5 class="fw-bold mb-0">${c.name}</h5>
                                <div class="my-1">
                                    <span class="badge bg-primary">${c.age} yrs old</span>
                                    <span class="badge bg-secondary">${c.gender || 'Male'}</span>
                                </div>
                                <div class="small text-muted">${c.delay_domain}</div>
                            </div>
                        </div>
                        <p class="small text-muted flex-grow-1">${c.notes || 'No additional notes.'}</p>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between small fw-semibold mb-1">
                                <span>Daily Progress (${done}/${total} tasks)</span>
                                <span>${pct}%</span>
                            </div>
                            <div class="progress" style="height: 12px; border-radius: 8px;">
                                <div class="progress-bar bg-success" role="progressbar" style="width: ${pct}%"></div>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="schedule-creator.html?child_id=${c.id}" class="btn btn-primary btn-sm flex-grow-1">
                                <i class="fa-solid fa-calendar-plus me-1"></i> Schedule
                            </a>
                            <a href="child-view.html?child_id=${c.id}" class="btn btn-success btn-sm flex-grow-1">
                                <i class="fa-solid fa-play me-1"></i> Child View
                            </a>
                            <button onclick="openEditModal(${c.id})" class="btn btn-outline-secondary btn-sm" title="Edit">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteChildProfile(${c.id})" class="btn btn-outline-danger btn-sm" title="Delete">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        } catch (err) {
            console.error(err);
        }
    }

    function openAddModal() {
        document.getElementById('modalTitle').textContent = 'Add New Child';
        document.getElementById('childId').value = '';
        document.getElementById('childForm').reset();
    }

    function openEditModal(id) {
        const c = childrenList.find(item => item.id === id);
        if (!c) return;
        document.getElementById('modalTitle').textContent = 'Edit Child Profile';
        document.getElementById('childId').value = c.id;
        document.getElementById('childName').value = c.name;
        document.getElementById('childAge').value = c.age;
        document.getElementById('childGender').value = c.gender || 'Male';
        document.getElementById('childDomain').value = c.delay_domain;
        document.getElementById('childPhoto').value = c.photo_url || '';
        document.getElementById('childNotes').value = c.notes || '';
        childModal.show();
    }

    async function deleteChildProfile(id) {
        if (!confirm('Delete this child profile and their schedules?')) return;
        await api.delete(`/children/${id}`);
        loadDashboard();
    }

    document.getElementById('childForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('childId').value;
        const payload = {
            name: document.getElementById('childName').value.trim(),
            age: parseInt(document.getElementById('childAge').value, 10),
            gender: document.getElementById('childGender').value,
            delay_domain: document.getElementById('childDomain').value,
            photo_url: document.getElementById('childPhoto').value.trim(),
            notes: document.getElementById('childNotes').value.trim()
        };

        if (id) {
            await api.put(`/children/${id}`, payload);
        } else {
            await api.post('/children', payload);
        }
        childModal.hide();
        loadDashboard();
    });

    loadDashboard();
</script>
</body>
</html>
