<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Visual Schedule System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md bg-white border-bottom px-3 py-2">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="dashboard.html">
            <i class="fa-solid fa-calendar-check"></i> Visual Schedule
        </a>
        <button class="navbar-toggler touch-target" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="d-none d-md-flex align-items-center gap-3">
            <div class="text-end">
                <div id="navUserName" class="fw-bold">Caregiver</div>
                <small id="navUserRole" class="text-muted">Role</small>
            </div>
            <button onclick="api.logout()" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar collapse d-md-block p-3" id="sidebarMenu">
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house"></i> <span data-i18n="dashboard">Dashboard</span></a>
                <a class="nav-link" href="schedule-creator.html"><i class="fa-solid fa-calendar-plus"></i> <span data-i18n="schedules">Schedule Creator</span></a>
                <a class="nav-link" href="child-view.html"><i class="fa-solid fa-child-reaching"></i> <span data-i18n="childView">Child View</span></a>
                <a class="nav-link" href="communication.html"><i class="fa-solid fa-comments"></i> <span data-i18n="talkingBoard">Talking Board</span></a>
                <a class="nav-link" href="progress.html"><i class="fa-solid fa-chart-column"></i> <span data-i18n="progress">Progress</span></a>
                <a class="nav-link active" href="settings.html"><i class="fa-solid fa-gear"></i> <span data-i18n="settings">Settings</span></a>
            </nav>
        </div>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 p-4">
            <div class="mb-4">
                <h2 class="fw-bold mb-0">Profile & Accessibility Settings</h2>
                <p class="text-muted mb-0">Customize account details and sensory/interface preferences</p>
            </div>

            <div class="row g-4">
                <!-- Profile Settings -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm p-4 h-100">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-user-pen text-primary me-2"></i>Profile Settings</h5>
                        <form id="profileForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" id="profName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" id="profEmail" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Role</label>
                                <select id="profRole" class="form-select">
                                    <option value="Caregiver">Caregiver / Parent</option>
                                    <option value="Occupational Therapist">Occupational Therapist</option>
                                    <option value="SPED Teacher">SPED Teacher</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Update Profile
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Accessibility, Voice & Preferences -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm p-4 h-100">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-universal-access text-success me-2"></i>Accessibility & Preferences</h5>
                        <form id="prefsForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Font Size</label>
                                <select id="prefFontSize" class="form-select">
                                    <option value="small">Small (16px)</option>
                                    <option value="medium">Medium (18px - Recommended)</option>
                                    <option value="large">Large (21px - High Visibility)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Color Contrast</label>
                                <select id="prefContrast" class="form-select">
                                    <option value="normal">Normal Soft Contrast</option>
                                    <option value="high">High Contrast (Dark/Yellow)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Interface Language</label>
                                <select id="prefLanguage" class="form-select">
                                    <option value="en">English</option>
                                    <option value="fil">Filipino (Tagalog)</option>
                                </select>
                            </div>

                            <!-- Moved Voice Settings -->
                            <div class="mb-3 p-3 rounded border bg-light">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label class="form-label fw-semibold mb-0"><i class="fa-solid fa-volume-high text-primary me-2"></i><span>Speed</span></label>
                                    <span id="prefVoiceSpeedLabel" class="fw-bold text-primary">0.9x</span>
                                </div>
                                <input type="range" id="prefVoiceSpeed" class="form-range mb-2" min="0.5" max="1.4" step="0.1" value="0.9">
                                <button type="button" class="btn btn-outline-primary btn-sm w-100" onclick="testSettingsVoice()">
                                    <i class="fa-solid fa-play me-2"></i>Test Voice
                                </button>
                            </div>

                            <hr>
                            <h6 class="fw-bold mb-3">Audio & Notification Toggles</h6>
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="prefSound" checked>
                                <label class="form-check-label fw-semibold" for="prefSound">Sound Effects On Task Completion</label>
                            </div>
                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="prefNotifications" checked>
                                <label class="form-check-label fw-semibold" for="prefNotifications">Task Reminder Notifications</label>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                <i class="fa-solid fa-check me-2"></i>Save Accessibility Preferences
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
    api.requireAuth();
    renderNavbarAndSidebar('settings.html');

    async function loadSettings() {
        const user = await api.get('/auth/me');
        document.getElementById('profName').value = user.name;
        document.getElementById('profEmail').value = user.email;
        document.getElementById('profRole').value = user.role;

        const prefs = JSON.parse(localStorage.getItem('vs_prefs') || '{}');
        document.getElementById('prefFontSize').value = prefs.fontSize || 'medium';
        document.getElementById('prefContrast').value = prefs.contrast || 'normal';
        document.getElementById('prefLanguage').value = prefs.language || 'en';
        document.getElementById('prefSound').checked = prefs.sound !== false;
        document.getElementById('prefNotifications').checked = prefs.notifications !== false;

        const voiceCfg = JSON.parse(localStorage.getItem('vs_voice_cfg') || '{"rate":0.9}');
        const rateVal = voiceCfg.rate || 0.9;
        document.getElementById('prefVoiceSpeed').value = rateVal;
        document.getElementById('prefVoiceSpeedLabel').textContent = `${rateVal}x`;
    }

    document.getElementById('prefVoiceSpeed').addEventListener('input', (e) => {
        const rate = parseFloat(e.target.value);
        document.getElementById('prefVoiceSpeedLabel').textContent = `${rate}x`;
    });

    function testSettingsVoice() {
        const previewLang = document.getElementById('prefLanguage').value;
        const previewRate = parseFloat(document.getElementById('prefVoiceSpeed').value || 0.9);
        const sample = previewLang === 'fil'
            ? 'Gusto ko ng tubig at mansanas!'
            : 'I want water and apple, please!';
        speakText(sample, true, previewLang, previewRate);
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById('profName').value.trim(),
            email: document.getElementById('profEmail').value.trim(),
            role: document.getElementById('profRole').value
        };
        await api.put('/auth/profile', payload);
        const current = api.getUser() || {};
        localStorage.setItem('vs_user', JSON.stringify({ ...current, ...payload }));
        renderNavbarAndSidebar('settings.html');
        showToast('Profile updated successfully!');
    });

    document.getElementById('prefsForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const lang = document.getElementById('prefLanguage').value;
        const rate = parseFloat(document.getElementById('prefVoiceSpeed').value || 0.9);

        const prefs = {
            fontSize: document.getElementById('prefFontSize').value,
            contrast: document.getElementById('prefContrast').value,
            language: lang,
            sound: document.getElementById('prefSound').checked,
            notifications: document.getElementById('prefNotifications').checked
        };
        localStorage.setItem('vs_prefs', JSON.stringify(prefs));

        const voiceCfg = {
            lang: lang === 'fil' ? 'fil-PH' : 'en-US',
            rate: rate
        };
        localStorage.setItem('vs_voice_cfg', JSON.stringify(voiceCfg));

        applyAccessibilitySettings();
        playSuccessSound();
        showToast('Accessibility & voice preferences saved!');
    });

    loadSettings();
</script>
</body>
</html>
