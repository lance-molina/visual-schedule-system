<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Visual Schedule System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md bg-white border-bottom px-3 py-2">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="dashboard.html">
            <i class="fa-solid fa-calendar-check"></i> Visual Schedule
        </a>
        <button class="navbar-toggler touch-target" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="d-none d-md-flex align-items-center gap-3">
            <div class="text-end">
                <div id="navUserName" class="fw-bold">Caregiver</div>
                <small id="navUserRole" class="text-muted">Role</small>
            </div>
            <button onclick="api.logout()" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar collapse d-md-block p-3" id="sidebarMenu">
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-house"></i> <span data-i18n="dashboard">Dashboard</span></a>
                <a class="nav-link" href="schedule-creator.html"><i class="fa-solid fa-calendar-plus"></i> <span data-i18n="schedules">Schedule Creator</span></a>
                <a class="nav-link" href="child-view.html"><i class="fa-solid fa-child-reaching"></i> <span data-i18n="childView">Child View</span></a>
                <a class="nav-link" href="progress.html"><i class="fa-solid fa-chart-column"></i> <span data-i18n="progress">Progress</span></a>
                <a class="nav-link" href="settings.html"><i class="fa-solid fa-gear"></i> <span data-i18n="settings">Settings</span></a>
            </nav>
        </div>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 p-4">
            <h2 class="fw-bold mb-1">System & Accessibility Settings</h2>
            <p class="text-muted mb-4">Customize caregiver profile, sensory preferences, and interface accessibility</p>

            <div id="saveAlert" class="alert alert-success d-none">Settings saved successfully!</div>

            <div class="row g-4">
                <!-- Profile Settings -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm p-4 h-100">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-user-pen me-2 text-primary"></i>Profile Settings</h5>
                        <form id="profileForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" id="profName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" id="profEmail" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Role</label>
                                <select id="profRole" class="form-select">
                                    <option value="Caregiver">Caregiver</option>
                                    <option value="Occupational Therapist">Occupational Therapist</option>
                                    <option value="SPED Teacher">SPED Teacher</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Update Profile</button>
                        </form>
                    </div>
                </div>

                <!-- Accessibility & Language Settings -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm p-4 h-100">
                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-universal-access me-2 text-success"></i>Accessibility & Preferences</h5>
                        <form id="prefsForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Font Size</label>
                                <select id="prefFontSize" class="form-select">
                                    <option value="small">Small (16px)</option>
                                    <option value="medium">Medium (18px)</option>
                                    <option value="large">Large (21px)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Color Contrast</label>
                                <select id="prefContrast" class="form-select">
                                    <option value="normal">Normal Soft Contrast</option>
                                    <option value="high">High Contrast (Dark/Yellow)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Interface Language</label>
                                <select id="prefLanguage" class="form-select">
                                    <option value="en">English</option>
                                    <option value="fil">Filipino (Tagalog)</option>
                                </select>
                            </div>

                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="prefSound" checked>
                                <label class="form-check-label fw-semibold" for="prefSound">Sound Effects On Task Completion</label>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="prefNotifications" checked>
                                <label class="form-check-label fw-semibold" for="prefNotifications">Enable Routine Reminder Notifications</label>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Save Accessibility Preferences</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script>
    api.requireAuth();
    renderNavbarAndSidebar('settings.html');

    const user = api.getUser() || {};
    document.getElementById('profName').value = user.name || '';
    document.getElementById('profEmail').value = user.email || '';
    document.getElementById('profRole').value = user.role || 'Caregiver';

    const prefs = JSON.parse(localStorage.getItem('vs_prefs') || '{}');
    document.getElementById('prefFontSize').value = prefs.fontSize || 'medium';
    document.getElementById('prefContrast').value = prefs.contrast || 'normal';
    document.getElementById('prefLanguage').value = prefs.language || 'en';
    document.getElementById('prefSound').checked = prefs.sound !== false;
    document.getElementById('prefNotifications').checked = prefs.notifications !== false;

    function showSavedBanner() {
        const alertEl = document.getElementById('saveAlert');
        alertEl.classList.remove('d-none');
        setTimeout(() => alertEl.classList.add('d-none'), 3000);
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const updated = {
            name: document.getElementById('profName').value.trim(),
            email: document.getElementById('profEmail').value.trim(),
            role: document.getElementById('profRole').value
        };
        await api.put('/auth/profile', updated);
        api.setSession(api.getToken(), { ...user, ...updated });
        renderNavbarAndSidebar('settings.html');
        showSavedBanner();
    });

    document.getElementById('prefsForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newPrefs = {
            fontSize: document.getElementById('prefFontSize').value,
            contrast: document.getElementById('prefContrast').value,
            language: document.getElementById('prefLanguage').value,
            sound: document.getElementById('prefSound').checked,
            notifications: document.getElementById('prefNotifications').checked
        };
        localStorage.setItem('vs_prefs', JSON.stringify(newPrefs));
        applyAccessibilitySettings();
        showSavedBanner();
    });
</script>
</body>
</html>
